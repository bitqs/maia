<!DOCTYPE html>

<title>Laozi — Dao De Jing</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body { background: #ebe6da; font-family: var(--fb); }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
  #bgfill { position: absolute; inset: 0; z-index: 0; }

  header { position: relative; z-index: 2; padding: clamp(16px,2.6vh,34px) clamp(24px,3.5vw,60px) 0; pointer-events: none; }
  .eyebrow { font-size: clamp(11px,0.95vw,14px); letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.5; }
  h1 { font-size: clamp(24px,3vw,48px); font-weight: 400; line-height: 1.05; margin-top: 0.2em; font-family: var(--fd); }
  .sub { font-size: clamp(13px,1.4vw,20px); font-style: italic; opacity: 0.62; margin-top: 0.12em; font-family: var(--fd); }

  .controls { position: relative; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: clamp(8px,1vw,14px); padding: clamp(10px,1.4vh,20px) clamp(24px,3.5vw,60px) 0; }
  .seg { display: inline-flex; border: 0.5px solid; border-radius: 999px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 4px 17px; background: transparent; cursor: pointer; font-size: clamp(13px,1vw,16px); font-family: var(--fb); }
  .pill { width: auto; padding: 4px 17px; border-radius: 999px; border: 0.5px solid; background: transparent; cursor: pointer; font-size: clamp(13px,1vw,16px); font-family: var(--fb); }
  .pill:hover { background: rgba(255,255,255,0.05); }
  .pos { font-size: clamp(12px,0.95vw,15px); opacity: 0.5; }
  input[type=text] { padding: 5px 14px; border: 0.5px solid; border-radius: 999px; background: transparent; font-size: clamp(13px,1vw,15px); width: clamp(110px,11vw,170px); font-family: var(--fb); }

  /* the two-column body: graph left, inspector right */
  #body { position: relative; z-index: 1; flex: 1 1 auto; min-height: 0; display: flex; }
  #graphbox { position: relative; flex: 1 1 62%; min-width: 0; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #legend { position: absolute; bottom: clamp(10px,1.4vh,18px); left: clamp(24px,3.5vw,60px); font-size: clamp(11px,0.9vw,13px); opacity: 0.5; z-index: 2; pointer-events: none; }

  #inspector {
    flex: 0 0 clamp(300px, 36%, 480px);
    border-left: 0.5px solid;
    padding: clamp(18px,2.6vh,34px) clamp(20px,2.2vw,36px);
    overflow-y: auto; z-index: 3;
  }
  #inspector .kicker { font-size: clamp(11px,0.9vw,13px); letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
  #inspector .nm { font-size: clamp(24px,2.4vw,38px); line-height: 1.08; margin: 0.2em 0 0.1em; font-family: var(--fd); }
  #inspector .alt { font-size: clamp(15px,1.4vw,20px); opacity: 0.55; font-family: var(--fd); }
  .archive { margin-top: clamp(14px,2vh,24px); }
  .seg-label { font-size: clamp(11px,0.9vw,13px); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.5; margin-bottom: 0.3em; }
  .seg-body { font-size: clamp(14px,1.25vw,18px); line-height: 1.72; opacity: 0.9; margin-bottom: clamp(12px,1.8vh,22px); }
  .quote { border-left: 2px solid; padding-left: 14px; margin: clamp(10px,1.6vh,20px) 0; }
  .quote .q { font-size: clamp(16px,1.5vw,22px); line-height: 1.6; font-style: italic; font-family: var(--fd); }
  .quote .qs { font-size: clamp(12px,1vw,14px); opacity: 0.55; margin-top: 0.4em; }
  .rels { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: clamp(8px,1.2vh,16px); }
  .rel { font-size: clamp(12.5px,1.1vw,15px); opacity: 0.72; cursor: pointer; }
  .rel:hover { opacity: 1; text-decoration: underline; }
  .hint { font-size: clamp(14px,1.3vw,18px); line-height: 1.7; opacity: 0.65; font-style: italic; font-family: var(--fd); }

  footer { position: relative; z-index: 2; padding: 0 clamp(24px,3.5vw,60px) clamp(8px,1.2vh,16px); font-size: clamp(11px,0.9vw,13px); opacity: 0.4; font-style: italic; font-family: var(--fd); }

  /* present mode */
  body.present .eyebrow, body.present .controls, body.present footer { display: none; }
  #presentBtn { position: absolute; top: clamp(16px,2.6vh,34px); right: clamp(24px,3.5vw,60px); z-index: 5; }

  /* narrow screens: stack */
  @media (max-width: 720px) {
    #body { flex-direction: column; }
    #graphbox { flex: 1 1 55%; }
    #inspector { flex: 1 1 45%; border-left: none; border-top: 0.5px solid; }
  }
</style>

<script>
const DATA = {"graph": {"schema": "bilingual-v2", "lang_default": "en", "expert": {"en": "Laozi — Dao De Jing", "zh": "老子《道德经》"}, "domain": {"en": "Core Concept System", "zh": "核心概念体系"}, "nodes": [{"id": "dao-the-way", "name": {"en": "Dao (the Way)", "zh": "道"}, "type": "theory", "difficulty": "foundational", "relevance": 1.0, "summary": {"en": "The source and pattern of all things; nameless, prior to heaven and earth. The bedrock of the whole system.", "zh": "万物的本源与运行规律，不可名状、先于天地。是整个体系的根基。"}, "sources": ["Ch.1", "Ch.25", "Ch.42"], "profile": {"what": {"en": "The Dao is the nameless source from which all things arise and the pattern by which they move. It precedes heaven and earth, cannot be fully spoken, and yet is present in everything that exists.", "zh": "道是万物由之而生的无名本源，也是万物运行所循的规律。它先于天地、不可尽言，却又遍在于一切存在之中。"}, "why": {"en": "Everything else in Laozi's thought is a consequence of the Dao. Without grasping it, the other concepts read as scattered advice; with it, they become one coherent vision of how to live in accord with reality.", "zh": "老子思想中其余一切皆由道推衍而来。不解道，其余概念便如散落的劝诫；解道，它们才合为一套如何顺应实在而生的完整观照。"}, "position": {"en": "The Dao is the root of the entire graph: De manifests it, wu-wei accords with it, ziran is the manner in which it operates. Nearly every other concept ultimately points back here.", "zh": "道是整张图的根：德显现它，无为顺应它，自然是它运作的方式。几乎所有其他概念最终都指回于此。"}, "quote": {"en": "The Dao that can be spoken is not the eternal Dao.", "zh": "道可道，非常道。"}, "quote_source": "Ch.1 第一章"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "de-virtue-power", "name": {"en": "De (virtue/power)", "zh": "德"}, "type": "theory", "difficulty": "foundational", "relevance": 0.95, "summary": {"en": "The manifestation of Dao within concrete things. Dao is substance, De is its function.", "zh": "道在具体万物中的显现与作用。道为体，德为用。"}, "sources": ["Ch.38", "Ch.51"], "profile": {"what": {"en": "De is the Dao made concrete within particular things — the power or virtue a thing receives from the Dao that makes it what it is. If the Dao is the underlying substance, De is its visible function.", "zh": "德是道在具体万物中的落实——万物得之于道、成其所是的那种力量或品性。若道为体，德即为用。"}, "why": {"en": "De answers how the abstract Dao touches the concrete world. It is the bridge between the ineffable source and lived conduct, which is why the text is named for both.", "zh": "德回答了抽象之道如何触及具体世界。它是不可言之本源与现实行止之间的桥梁，故全书以道、德并名。"}, "position": {"en": "De is part of the Dao — its expression in things. It stands just beside the Dao at the foundation, and the ethical concepts (wu-wei, the sage) draw on it.", "zh": "德是道的构成——道在万物中的表达。它紧邻道而居于根基，伦理诸概念（无为、圣人）皆取资于它。"}, "quote": {"en": "The highest virtue is not virtuous, and so it has virtue.", "zh": "上德不德，是以有德。"}, "quote_source": "Ch.38 第三十八章"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "wu-wei-non-action", "name": {"en": "Wu-wei (non-action)", "zh": "无为"}, "type": "method", "difficulty": "intermediate", "relevance": 0.9, "summary": {"en": "Acting without forcing; following the nature of things. Not passivity but non-interference.", "zh": "不妄为、不强加干预，顺应事物本性而行。并非消极不动。"}, "sources": ["Ch.37", "Ch.48", "Ch.63"], "profile": {"what": {"en": "Wu-wei is action without forcing — doing by not contending, accomplishing by not interfering. It is not idleness but the art of acting in such accord with a situation's own grain that effort disappears.", "zh": "无为是不强为之行——以不争而为，以不扰而成。它非懒怠，而是顺势而动、与事物本然之纹理相契，以至于用力之迹消隐的功夫。"}, "why": {"en": "It is Laozi's central practical teaching: the translation of the Dao into how one should act, govern, and live. Most of the text's advice on rulership and conduct is wu-wei applied.", "zh": "它是老子核心的实践教诲：将道译为人当如何行、如何治、如何生。书中关于治国与处世的大半劝诫，皆是无为之应用。"}, "position": {"en": "Wu-wei embodies the Dao and accords with ziran; non-contention and softness are its facets; the sage and the art of governing are its practitioners. It is the hinge between metaphysics and conduct.", "zh": "无为体现道、顺应自然；不争与柔弱是其侧面；圣人与治国是其践行者。它是形上与行止之间的枢纽。"}, "quote": {"en": "Act without action, and there is nothing that is not in order.", "zh": "为无为，则无不治。"}, "quote_source": "Ch.3 第三章"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "ziran-naturalness", "name": {"en": "Ziran (naturalness)", "zh": "自然"}, "type": "theory", "difficulty": "foundational", "relevance": 0.92, "summary": {"en": "Self-so, being as one inherently is. Dao follows ziran — its own spontaneous nature.", "zh": "自己如此、本来如是。道法自然——道效法事物自身的本然。"}, "sources": ["Ch.25", "Ch.17"], "profile": {"what": {"en": "Ziran means 'self-so' — being just as one inherently is, without external imposition. It is spontaneity not in the sense of randomness but of unforced naturalness.", "zh": "自然即“自己如此”——本来如是、不假外加。它的“自发”非指随意，而是不勉强的本然。"}, "why": {"en": "Ziran is the standard the Dao itself follows; it tells us that the goal is not to impose order but to let things unfold according to their own nature.", "zh": "自然是道自身所效法的准则；它告诉我们，目的不在强加秩序，而在让万物依其本性舒展。"}, "position": {"en": "It sits at the foundation beside the Dao — 'the Dao follows ziran' — and wu-wei and pu (simplicity) both derive their meaning from it.", "zh": "它与道同居根基——“道法自然”——无为与朴皆由它得义。"}, "quote": {"en": "Humans follow earth, earth follows heaven, heaven follows the Dao, and the Dao follows what is natural.", "zh": "人法地，地法天，天法道，道法自然。"}, "quote_source": "Ch.25 第二十五章"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "wu-nothing-void", "name": {"en": "Wu (nothing/void)", "zh": "无"}, "type": "concept", "difficulty": "advanced", "relevance": 0.85, "summary": {"en": "The empty, undifferentiated state. All things arise from being, being arises from non-being.", "zh": "空、虚、未分化之状态。天下万物生于有，有生于无。"}, "sources": ["Ch.1", "Ch.11", "Ch.40"], "profile": {"what": {"en": "Wu is emptiness or non-being — the undifferentiated, formless state out of which form arises. It is not mere absence but a generative void, like the hollow that makes a vessel useful.", "zh": "无是空、是无形——形由之而生的未分化之态。它非单纯的缺失，而是能生的虚空，如器之中空方能为用。"}, "why": {"en": "Wu reframes value: usefulness comes from what is not there. This inverts ordinary intuition and underlies the whole aesthetic of restraint and the power of the empty.", "zh": "无重估了价值：用处恰来自于其所无。这颠覆了寻常直觉，是整套以约制、以虚为强之审美的根柢。"}, "position": {"en": "Wu is part of the Dao — its formless aspect. Being (you) arises from it; emptiness-and-stillness (xu-jing) is the practice of approaching it.", "zh": "无是道的构成——其无形的一面。有由之而生；虚静是趋近于它的功夫。"}, "quote": {"en": "All things are born of being; being is born of non-being.", "zh": "天下万物生于有，有生于无。"}, "quote_source": "Ch.40 第四十章"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "you-being", "name": {"en": "You (being)", "zh": "有"}, "type": "concept", "difficulty": "advanced", "relevance": 0.8, "summary": {"en": "Formed, nameable existence. Mutually arising with non-being.", "zh": "已成形、可见可名的存在。与无相生相成。"}, "sources": ["Ch.1", "Ch.2", "Ch.11"], "profile": {"what": {"en": "You is being — formed, nameable, manifest existence. It is the world of distinct things that have come into shape out of the formless.", "zh": "有即存在——已成形、可名、显现的实在。它是从无形中成形而出的万有之界。"}, "why": {"en": "Being and non-being are Laozi's basic ontological pair; understanding their mutual arising is the key to the famous 'usefulness of emptiness'.", "zh": "有与无是老子最基本的存在论对偶；解其相生，方解著名的‘虚之为用’。"}, "position": {"en": "You arises from wu (being is born of non-being) and is itself part of the Dao's manifestation.", "zh": "有生于无，且本身是道之显现的一部分。"}, "quote": {"en": "Being and non-being produce each other.", "zh": "有无相生。"}, "quote_source": "Ch.2"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "yin-yang", "name": {"en": "Yin-Yang", "zh": "阴阳"}, "type": "concept", "difficulty": "intermediate", "relevance": 0.75, "summary": {"en": "All things carry yin and embrace yang, blending qi into harmony. Interdependent, transforming poles.", "zh": "万物负阴而抱阳，冲气以为和。对立两极相互依存、转化。"}, "sources": ["Ch.42"], "profile": {"what": {"en": "Yin and yang are the two complementary, opposing forces whose interplay constitutes all change. All things carry yin and embrace yang, blending vital breath into harmony.", "zh": "阴阳是构成一切变化的两种互补对立之力。万物负阴而抱阳，冲气以为和。"}, "why": {"en": "It supplies the engine of transformation in Laozi's cosmos — nothing is static; every state contains the seed of its opposite.", "zh": "它为老子宇宙中的转化提供动力——无物恒静；每一状态皆含其反面之种子。"}, "position": {"en": "Yin-yang is part of the Dao's generative structure, and the principle of reversal derives from it.", "zh": "阴阳是道之生成结构的一部分，‘反’的规律由之而出。"}, "quote": {"en": "All things carry yin and embrace yang.", "zh": "万物负阴而抱阳。"}, "quote_source": "Ch.42"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "fan-reversal", "name": {"en": "Fan (reversal)", "zh": "反"}, "type": "theory", "difficulty": "intermediate", "relevance": 0.78, "summary": {"en": "Reversal is the movement of Dao. At its extreme a thing turns into its opposite; cyclical return.", "zh": "反者道之动。事物发展到极致必向反面转化，循环往复。"}, "sources": ["Ch.40", "Ch.58"], "profile": {"what": {"en": "Fan is reversal — the tendency of anything pushed to its extreme to turn into its opposite, and the cyclical return of all things to their root. It names the very movement of the Dao.", "zh": "反即反转——任何事物推至极致便转向其反面的倾向，以及万物循环复归其根。它正是道的运动本身。"}, "why": {"en": "It is Laozi's law of dynamics: it explains why softness outlasts hardness and why grasping defeats itself, grounding the entire ethics of yielding.", "zh": "它是老子的动力学法则：解释了何以柔能胜刚、执反自败，是整套‘守柔退让’伦理的根基。"}, "position": {"en": "Fan embodies the Dao's movement and derives from yin-yang; softness follows from it.", "zh": "反体现道之动、源于阴阳；柔弱由之而来。"}, "quote": {"en": "Reversal is the movement of the Dao.", "zh": "反者道之动。"}, "quote_source": "Ch.40"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "rou-softness", "name": {"en": "Rou (softness)", "zh": "柔弱"}, "type": "concept", "difficulty": "intermediate", "relevance": 0.72, "summary": {"en": "The soft overcomes the hard. Holding to softness endures and prevails, like water.", "zh": "柔弱胜刚强。守柔处下反而能持久、能胜，如水。"}, "sources": ["Ch.36", "Ch.76", "Ch.78"], "profile": {"what": {"en": "Rou is softness and weakness held as strength. What is supple and yielding outlasts what is rigid; the soft overcomes the hard, as water wears away stone.", "zh": "柔弱是以柔为强。柔软退让者长存于刚硬者之上；柔弱胜刚强，如水之磨石。"}, "why": {"en": "It turns conventional notions of power upside down — the central practical insight of how to endure and prevail without force.", "zh": "它颠倒了寻常的力量观念——是‘不以力而能持久、能胜’这一核心实践洞见。"}, "position": {"en": "Softness derives from the law of reversal and is a facet of wu-wei; water is its great image.", "zh": "柔弱源于‘反’的规律，是无为的一个侧面；水是其大象。"}, "quote": {"en": "The soft and weak overcome the hard and strong.", "zh": "柔弱胜刚强。"}, "quote_source": "Ch.36"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "shui-water", "name": {"en": "Shui (water)", "zh": "水"}, "type": "concept", "difficulty": "intermediate", "relevance": 0.7, "summary": {"en": "The supreme good is like water: it benefits all without contending, dwelling where others disdain.", "zh": "上善若水。利万物而不争，处众人之所恶，最接近道。"}, "sources": ["Ch.8", "Ch.78"], "profile": {"what": {"en": "Water is Laozi's supreme image of the Dao: it benefits all things without contending, and dwells in the low places everyone disdains. Soft and formless, it yet wears down the hardest stone.", "zh": "水是老子喻道之至象：利万物而不争，处众人之所恶的卑下之地。柔而无形，却能磨穿最坚之石。"}, "why": {"en": "It makes the abstract virtues of yielding and non-contention vivid and concrete — the most teachable single image in the text.", "zh": "它把柔弱与不争的抽象之德化为鲜活具体——是全书最易于教学的单一意象。"}, "position": {"en": "Water is the image of softness and non-contention, embodying both at once.", "zh": "水是柔弱与不争之象，二者兼体于一身。"}, "quote": {"en": "The highest good is like water.", "zh": "上善若水。"}, "quote_source": "Ch.8"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "bu-zheng-not-contending", "name": {"en": "Bu-zheng (not contending)", "zh": "不争"}, "type": "concept", "difficulty": "intermediate", "relevance": 0.68, "summary": {"en": "Because one does not contend, none can contend with them. Yielding becomes greatness.", "zh": "不与人争而天下莫能与之争。退让谦下反成其大。"}, "sources": ["Ch.8", "Ch.22", "Ch.66"], "profile": {"what": {"en": "Bu-zheng is non-contention — declining to strive, compete, or assert. By not contending, one provokes no opposition, and so cannot be opposed.", "zh": "不争即不与人争、不竞、不矜。因不争，故不招对立，遂莫能与之争。"}, "why": {"en": "It is the social and political face of wu-wei: yielding becomes a form of strength that gathers rather than repels.", "zh": "它是无为的社会与政治之面：退让成为一种能聚而不拒的力量。"}, "position": {"en": "Non-contention is part of wu-wei and is embodied by water; contentment leads toward it.", "zh": "不争是无为的构成，由水所体现；知足导向于它。"}, "quote": {"en": "Because he does not contend, no one can contend with him.", "zh": "夫唯不争，故天下莫能与之争。"}, "quote_source": "Ch.22"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "pu-the-uncarved-block", "name": {"en": "Pu (the uncarved block)", "zh": "朴"}, "type": "concept", "difficulty": "intermediate", "relevance": 0.7, "summary": {"en": "The state of unworked simplicity. Embrace plainness, reduce desire; return to the uncarved is to return to Dao.", "zh": "未经雕琢的本真状态。见素抱朴，少私寡欲；返朴归道。"}, "sources": ["Ch.19", "Ch.28", "Ch.32"], "profile": {"what": {"en": "Pu is the uncarved block — the state of original, unworked simplicity before names and distinctions are imposed. To embrace plainness and reduce desire is to return to it.", "zh": "朴即未雕之木——名相分别加诸之前，本初未经斫琢的素朴之态。见素抱朴、少私寡欲，即归于此。"}, "why": {"en": "It is the goal of self-cultivation: stripping away artifice to recover one's natural condition, which is closest to the Dao.", "zh": "它是修养的归宿：剥去造作以复其本然之态，最近于道。"}, "position": {"en": "Pu is akin to ziran (naturalness) and is a way back to the Dao; contentment derives from it.", "zh": "朴近于自然，是返归于道之途；知足由之而来。"}, "quote": {"en": "Manifest plainness, embrace the uncarved block.", "zh": "见素抱朴。"}, "quote_source": "Ch.19"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "xu-jing-emptiness-stillness", "name": {"en": "Xu-jing (emptiness & stillness)", "zh": "虚静"}, "type": "method", "difficulty": "advanced", "relevance": 0.65, "summary": {"en": "Attain utmost emptiness, hold to stillness. A clear quiet mind perceives the root of all things.", "zh": "致虚极，守静笃。心境空明方能观照万物之根。"}, "sources": ["Ch.16"], "profile": {"what": {"en": "Xu-jing is emptiness-and-stillness — the cultivated state of a mind emptied to the utmost and held in deep stillness, from which one can observe the return of all things to their root.", "zh": "虚静即虚极守静——心致虚之极、守静之笃的修养之态，由此可观万物复归其根。"}, "why": {"en": "It is the contemplative practice that lets one actually perceive the Dao at work, rather than merely believe in it.", "zh": "它是使人真能观照道之运作、而非仅信之的观照功夫。"}, "position": {"en": "Emptiness-and-stillness is akin to wu (the void) and is a path that leads toward the Dao.", "zh": "虚静近于无，是通向道的一条途径。"}, "quote": {"en": "Attain utmost emptiness; hold to deep stillness.", "zh": "致虚极，守静笃。"}, "quote_source": "Ch.16"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "shengren-the-sage", "name": {"en": "Shengren (the sage)", "zh": "圣人"}, "type": "concept", "difficulty": "intermediate", "relevance": 0.74, "summary": {"en": "The ideal person who embodies Dao: governs by non-action, teaches without words.", "zh": "体道而行的理想人格。处无为之事，行不言之教。"}, "sources": ["Ch.2", "Ch.7", "Ch.66"], "profile": {"what": {"en": "The shengren (sage) is the ideal person who fully embodies the Dao: governing by non-action, teaching without words, putting himself last and so coming first.", "zh": "圣人是全然体道的理想人格：以无为而治，行不言之教，后其身而身先。"}, "why": {"en": "The sage is the living model of the whole philosophy — what a life lived in accord with the Dao actually looks like.", "zh": "圣人是整套哲学的活范本——一个依道而生的生命究竟是何模样。"}, "position": {"en": "The sage practices wu-wei and is the figure on whom governing-by-Dao depends.", "zh": "圣人践行无为，是以道治国所依托之人。"}, "quote": {"en": "The sage manages affairs without action, and teaches without words.", "zh": "圣人处无为之事，行不言之教。"}, "quote_source": "Ch.2"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "zhiguo-governing", "name": {"en": "Zhiguo (governing)", "zh": "治国"}, "type": "method", "difficulty": "intermediate", "relevance": 0.66, "summary": {"en": "Ruling by Dao: do not disturb the people, let them transform themselves. Wu-wei applied to politics.", "zh": "以道治国：不扰民、不尚贤，使民自化。无为的政治落地。"}, "sources": ["Ch.3", "Ch.57", "Ch.60"], "profile": {"what": {"en": "Zhiguo is governing by the Dao: not disturbing the people, not exalting cleverness or coveted goods, but letting them transform themselves. It is wu-wei applied to statecraft.", "zh": "治国即以道治世：不扰民、不尚贤、不贵难得之货，而使民自化。是无为之于治术的应用。"}, "why": {"en": "It shows that Laozi's philosophy is not merely personal but political — a complete theory of light-handed rule.", "zh": "它表明老子之学非仅修身，亦关治世——一套完整的‘无为之治’理论。"}, "position": {"en": "Governing practices wu-wei and depends on the sage as its ideal ruler.", "zh": "治国践行无为，并以圣人为其理想统治者所依托。"}, "quote": {"en": "Govern a great state as you would cook a small fish.", "zh": "治大国若烹小鲜。"}, "quote_source": "Ch.60"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}, {"id": "zhizu-contentment", "name": {"en": "Zhizu (contentment)", "zh": "知足"}, "type": "concept", "difficulty": "foundational", "relevance": 0.7, "summary": {"en": "Knowing contentment avoids disgrace; knowing when to stop avoids danger. No calamity greater than discontent.", "zh": "知足不辱，知止不殆。祸莫大于不知足；节制欲望方能长久。"}, "sources": ["Ch.44", "Ch.46"], "profile": {"what": {"en": "Zhizu is knowing contentment — recognizing what is enough. Knowing contentment one avoids disgrace; knowing when to stop one avoids danger. No calamity is greater than not knowing what is enough.", "zh": "知足即知其所足。知足者不辱，知止者不殆。祸莫大于不知足。"}, "why": {"en": "It is the practical antidote to desire, the daily discipline that keeps a life close to the Dao and free of self-inflicted ruin.", "zh": "它是欲望的实践解药，是使生命近于道、免于自招之祸的日常之律。"}, "position": {"en": "Contentment derives from simplicity (pu) and leads toward non-contention.", "zh": "知足源于朴，并导向不争。"}, "quote": {"en": "He who knows contentment is rich.", "zh": "知足者富。"}, "quote_source": "Ch.33"}, "tags": [], "depth": 0, "aliases": [], "explored_by": "main"}], "edges": [{"source": "de-virtue-power", "target": "dao-the-way", "relation": {"en": "part of", "zh": "构成"}, "evidence": null}, {"source": "dao-the-way", "target": "ziran-naturalness", "relation": {"en": "follows", "zh": "依循"}, "evidence": null}, {"source": "wu-wei-non-action", "target": "dao-the-way", "relation": {"en": "embodies", "zh": "体现"}, "evidence": null}, {"source": "wu-wei-non-action", "target": "ziran-naturalness", "relation": {"en": "accords with", "zh": "顺应"}, "evidence": null}, {"source": "you-being", "target": "wu-nothing-void", "relation": {"en": "arises from", "zh": "生于"}, "evidence": null}, {"source": "wu-nothing-void", "target": "dao-the-way", "relation": {"en": "part of", "zh": "属于"}, "evidence": null}, {"source": "you-being", "target": "dao-the-way", "relation": {"en": "part of", "zh": "属于"}, "evidence": null}, {"source": "yin-yang", "target": "dao-the-way", "relation": {"en": "part of", "zh": "属于"}, "evidence": null}, {"source": "fan-reversal", "target": "dao-the-way", "relation": {"en": "embodies", "zh": "体现"}, "evidence": null}, {"source": "fan-reversal", "target": "yin-yang", "relation": {"en": "derives from", "zh": "源于"}, "evidence": null}, {"source": "rou-softness", "target": "fan-reversal", "relation": {"en": "derives from", "zh": "源于"}, "evidence": null}, {"source": "shui-water", "target": "rou-softness", "relation": {"en": "images", "zh": "为象"}, "evidence": null}, {"source": "shui-water", "target": "bu-zheng-not-contending", "relation": {"en": "images", "zh": "为象"}, "evidence": null}, {"source": "bu-zheng-not-contending", "target": "w const G = DATA.graph, TH = DATA.theme;
const NODES = G.nodes, EDGES = G.edges;
const META = G.meta || {tour: [], foundational: []};
const byId = {}; NODES.forEach(n => byId[n.id] = n);
const FOUND = new Set(META.foundational || []);
let lang = (G.lang_default === "zh") ? "zh" : "en";

document.documentElement.style.setProperty("--fb", TH.font_body);

const NS="http://www.w3.org/2000/svg";

function el(t,a){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }
function nm(n,l){ const v=n.name||{}; return (l==="zh"?v.zh:v.en)||v.en||v.zh||n.id; }
function sm(n,l){ const v=n.summary||{}; return (l==="zh"?v.zh:v.en)||v.en||v.zh||""; }

let W=1200,H=700,pos={};
function computeLayout(){
  const box=document.getElementById("graphbox").getBoundingClientRect();
  W=Math.max(420,box.width); H=Math.max(360,box.height);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const CX=W/2, CY=H/2, spread=Math.min(W,H)*0.44;
  const root=(META.tour&&META.tour[0])||(META.foundational&&META.foundational[0])||NODES[0].id;
  pos={};
  NODES.forEach((n,i)=>{const a=i/NODES.length*6.283;const r=spread*(0.35+(1-relevance(n))*0.65);pos[n.id]={x:CX+Math.cos(a)*r,y:CY+Math.sin(a)*r,vx:0,vy:0};});
  if(TH.layout==="grid"){
    const order=[...NODES].sort((a,b)=>relevance(b)-relevance(a));
    const cols=Math.max(3,Math.round(Math.sqrt(NODES.length)*1.2));
    const cw=W/(cols+1),rh=Math.min(H/(Math.ceil(NODES.length/cols)+1),120);
    order.forEach((n,i)=>{const r=Math.floor(i/cols),c=i%cols;pos[n.id]={x:cw*(c+1)+(r%2)*20,y:rh*(r+1.2),vx:0,vy:0};});
    drawAll();return;
  }
  pos[root]={x:CX,y:CY,vx:0,vy:0};
  const ids=NODES.map(n=>n.id),repel=spread*spread*1.0,LL=spread*0.78;
  for(let it=0;it<480;it++){
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=pos[ids[i]],b=pos[ids[j]];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1,f=repel/(d*d);a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;}
    EDGES.forEach(e=>{const a=pos[e.source],b=pos[e.target];if(!a||!b)return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-LL)*0.013;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;});
    ids.forEach(k=>{const n=pos[k],tr=spread*(0.28+(1-relevance(byId[k]))*0.72);let dx=n.x-CX,dy=n.y-CY,d=Math.hypot(dx,dy)||1;n.vx+=dx/d*(tr-d)*0.02;n.vy+=dy/d*(tr-d)*0.02;if(k===root){n.x=CX;n.y=CY;return;}n.x+=(n.vx*=0.8);n.y+=(n.vy*=0.8);const m=Math.min(W,H)*0.07,mb=Math.min(W,H)*0.14;n.x=Math.max(m,Math.min(W-m,n.x));n.y=Math.max(m,Math.min(H-mb,n.y));});
  }
  drawAll();
}

let edgeEls=[],nodeEls={};
function drawAll(){
  eg.innerHTML="";ng.innerHTML="";edgeEls=[];nodeEls={};
  const base=Math.min(W,H),coreR=base*0.072,periR=base*0.022;
  EDGES.forEach(e=>{const a=pos[e.source],b=pos[e.target];if(!a||!b)return;let d;
    if(TH.edge_style==="straight"||TH.edge_style==="elbow"){d=`M${a.x},${a.y} L${b.x},${b.y}`;}
    else{const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,h=Math.hypot(dx,dy)||1,k=(TH.edge_style==="arc"?0.06:0.045)*base;const cx=mx-dy/h*k,cy=my+dx/h*k;d=`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`;}
    const p=el("path",{d,stroke:TH.node_edge,"stroke-width":"1","stroke-opacity":"0.18",fill:"none","stroke-linecap":"round"});p.dataset.s=e.source;p.dataset.t=e.target;eg.appendChild(p);edgeEls.push(p);});
  NODES.forEach(n=>{const pt=pos[n.id];if(!pt)return;const isCore=FOUND.has(n.id),r=relevance(n);
    const g=el("g",{transform:`translate(${pt.x},${pt.y})`});g.style.cursor="pointer";g.dataset.id=n.id;g.tabIndex=0;g.setAttribute("role","button");g.setAttribute("aria-label",nm(n,lang));
    g.onclick=()=>select(n.id);g.onkeydown=(ev)=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(n.id);}};
    if(TH.node_shape==="rounded_rect"){
      const fp=isCore?base*0.022:base*0.017,label=nm(n,lang),w=Math.max(label.length*fp*0.62+24,base*0.1),h=fp*2.1;
      if(r>0.85&&TH.centrality_by!=="size")g.appendChild(el("circle",{r:w*0.6,fill:"url(#halo)"}));
      g.appendChild(el("rect",{x:-w/2,y:-h/2,width:w,height:h,rx:6,fill:TH.node_core,"fill-opacity":(0.14+r*0.34).toFixed(2),stroke:TH.accent,"stroke-opacity":(0.4+r*0.5).toFixed(2),"stroke-width":isCore?"1.4":"0.7"}));
      const t=el("text",{"text-anchor":"middle","dominant-baseline":"central","font-family":TH.font_display,fill:TH.text_on_bg,"fill-opacity":(0.72+r*0.28).toFixed(2),"font-size":fp.toFixed(1),"letter-spacing":TH.letterspacing});t.textContent=label;g.appendChild(t);
    } else {
      const R=periR+r*(coreR-periR);
      const ntype=n.type||"concept";
      /* flat warm circle */
      const c=el("circle",{r:R.toFixed(1),fill:TH.node_core,"fill-opacity":(0.50+r*0.40).toFixed(2),stroke:TH.ink,"stroke-opacity":(0.06+r*0.10).toFixed(2),"stroke-width":"0.8"});
      g.appendChild(c);
      /* type icon — simple geometric symbol */
      const sc=R*0.36,sw=Math.max(0.6,R*0.068).toFixed(2);
      const ia={stroke:TH.ink,"stroke-width":sw,"stroke-linecap":"round","stroke-linejoin":"round",fill:"none","stroke-opacity":"0.24"};
      if(ntype==="theory"){
        /* open book: two pages meeting at spine */
        const bx=sc*0.72,by1=sc*0.50,by2=sc*0.68,bt=sc*0.70;
        g.appendChild(el("path",Object.assign({},ia,{d:`M0,${-bt.toFixed(1)} L${-bx.toFixed(1)},${-by1.toFixed(1)} L${-bx.toFixed(1)},${by2.toFixed(1)} L0,${by2.toFixed(1)} L${bx.toFixed(1)},${by2.toFixed(1)} L${bx.toFixed(1)},${-by1.toFixed(1)} Z`})));
        g.appendChild(el("line",Object.assign({},ia,{x1:"0",y1:(-bt).toFixed(1),x2:"0",y2:by2.toFixed(1)})));
        g.appendChild(el("line",Object.assign({},ia,{"stroke-opacity":"0.12",x1:(-sc*0.55).toFixed(1),y1:(-sc*0.08).toFixed(1),x2:(-sc*0.08).toFixed(1),y2:(-sc*0.08).toFixed(1)})));
      } else if(ntype==="method"){
        /* three horizontal lines, middle widest */
        [[0.58,-0.38],[0.68,0],[0.46,0.38]].forEach(([hw,fy])=>{
          g.appendChild(el("line",Object.assign({},ia,{x1:(-sc*hw).toFixed(1),y1:(sc*fy).toFixed(1),x2:(sc*hw).toFixed(1),y2:(sc*fy).toFixed(1)})));
        });
      } else if(ntype==="tool"){
        /* diamond */
        g.appendChild(el("path",Object.assign({},ia,{d:`M0,${(-sc*0.72).toFixed(1)} L${(sc*0.62).toFixed(1)},0 L0,${(sc*0.72).toFixed(1)} L${(-sc*0.62).toFixed(1)},0 Z`})));
      } else {
        /* concept: outer ring + inner dot */
        g.appendChild(el("circle",Object.assign({},ia,{r:(sc*0.65).toFixed(1)})));
        g.appendChild(el("circle",{r:(sc*0.20).toFixed(1),fill:TH.ink,"fill-opacity":"0.18",stroke:"none"}));
      }
      /* label below the circle */
      const fp=Math.min(base*0.016,R*0.52);
      const label=nm(n,lang);
      const t=el("text",{"text-anchor":"middle","font-family":TH.font_display,"fill":TH.ink,"fill-opacity":"0.80","font-size":fp.toFixed(1)});
      t.setAttribute("y",(R+fp*1.35).toFixed(1));t.textContent=label;g.appendChild(t);
    }
    ng.appendChild(g);nodeEls[n.id]=g;});
  if(cur)paint(cur);
}

const defs=document.getElementById("defs");
(function(){const c=el("radialGradient",{id:"core",cx:"50%",cy:"50%",r:"50%"});
  c.appendChild(el("stop",{offset:"0%","stop-color":"#ffffff","stop-opacity":"0.95"}));c.appendChild(el("stop",{offset:"55%","stop-color":TH.node_core}));c.appendChild(el("stop",{offset:"100%","stop-color":TH.ink,"stop-opacity":"0.6"}));defs.appendChild(c);
  const h=el("radialGradient",{id:"halo",cx:"50%",cy:"50%",r:"50%"});h.appendChild(el("stop",{offset:"0%","stop-color":TH.accent,"stop-opacity":"0.45"}));h.appendChild(el("stop",{offset:"100%","stop-color":TH.accent,"stop-opacity":"0"}));defs.appendChild(h);
  const f=el("filter",{id:"tshadow",x:"-40%",y:"-40%",width:"180%",height:"180%"});f.appendChild(el("feDropShadow",{dx:"0",dy:"0",stdDeviation:"3","flood-color":"#000000","flood-opacity":"0.92"}));defs.appendChild(f);})();

function showEdgeLabels(id){
  const elg=document.getElementById("elabels");elg.innerHTML="";
  if(!id)return;
  const base=Math.min(W,H),fp=base*0.0145;
  EDGES.forEach(e=>{
    if(e.source!==id&&e.target!==id)return;
    const a=pos[e.source],b=pos[e.target];if(!a||!b)return;
    const label=rel(e,lang);if(!label)return;
    /* midpoint of the bezier curve (t=0.5 approximation: just lerp endpoints) */
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    /* direction arrow: → if source==id, ← if target==id */
    const arrow=e.source===id?" →":" ←";
    const txt=label+arrow;
    const tw=txt.length*fp*0.60+14;
    const bg=el("rect",{x:(mx-tw/2).toFixed(1),y:(my-fp*0.92).toFixed(1),
      width:tw.toFixed(1),height:(fp*1.7).toFixed(1),rx:"4",
      fill:TH.bg_css,"fill-opacity":"0.92",
      stroke:TH.accent,"stroke-opacity":"0.4","stroke-width":"0.5"});
    const t=el("text",{"text-anchor":"middle","x":mx.toFixed(1),"y":(my+fp*0.52).toFixed(1),
      "font-family":TH.font_body,"font-size":fp.toFixed(1),
      fill:TH.ink,"fill-opacity":"0.80","letter-spacing":"0.025em"});
    t.textContent=txt;
    elg.appendChild(bg);elg.appendChild(t);
  });
}

function paint(id){
  /* build connected set for dimming unrelated nodes */
  const conn=new Set([id]);
  EDGES.forEach(e=>{if(e.source===id)conn.add(e.target);if(e.target===id)conn.add(e.source);});
  Object.values(nodeEls).forEach(g=>{
    const nid=g.dataset.id,nn=byId[nid],rr=relevance(nn);
    const s=g.querySelector("circle:last-of-type, rect"),t=g.querySelector("text");if(!s)return;
    if(nid===id){
      s.setAttribute("stroke",TH.ink);s.setAttribute("stroke-opacity","0.90");s.setAttribute("stroke-width","2.4");
      g.style.opacity="1";
    } else if(conn.has(nid)){
      s.setAttribute("stroke",TH.accent);s.setAttribute("stroke-opacity",(0.5+rr*0.4).toFixed(2));s.setAttribute("stroke-width","1.2");
      g.style.opacity="1";
    } else {
      s.setAttribute("stroke",TH.accent);s.setAttribute("stroke-opacity",(0.1+rr*0.15).toFixed(2));s.setAttribute("stroke-width","0.6");
      g.style.opacity="0.22";
    }
  });
  edgeEls.forEach(p=>{const on=p.dataset.s===id||p.dataset.t===id;p.setAttribute("stroke-opacity",on?"0.75":"0.06");p.setAttribute("stroke-width",on?"2.0":"0.8");});
  showEdgeLabels(id);
}

const STR={en:{tour:"start tour",next:"next ›",hint:"Tap any concept to read its full archive — what it is, why it matters, where it sits, and a key line. Or take the guided tour. ← → to step, F to present.",leg:"● solid = core   ○ faint = peripheral",search:"Search…",present:"⤢ present",what:"What it is",why:"Why it matters",position:"Its place in the system",rels:"Connections",src:"sources"},
            zh:{tour:"开始引导",next:"下一 ›",hint:"点按任一概念，读它的完整档案——是什么、为何重要、处于何位、关键一句。或循引导徐行。← → 翻页，F 演示。",leg:"● 实者为本   ○ 淡者为末",search:"搜索…",present:"⤢ 演示",what:"是什么",why:"为何重要",position:"在体系中的位置",rels:"关联",src:"出处"}};

function render(id){
  const n=byId[id],s=STR[lang];paint(id);
  const what=pf(n,"what",lang)||sm(n,lang), why=pf(n,"why",lang), position=pf(n,"position",lang), quote=pf(n,"quote",lang), qsrc=(n.profile||{}).quote_source||"";
  const conns=EDGES.filter(e=>e.source===id||e.target===id).map(e=>{const o=e.source===id?e.target:e.source,d=e.source===id?"→":"←";return `<span class="rel" data-go="${o}">${rel(e,lang)} ${d} ${nm(byId[o],lang)}</span>`;}).join("");
  const altName = lang==="en" ? ((n.name||{}).zh||"") : ((n.name||{}).en||"");
  const typeLabel={theory:lang==="zh"?"根本理念":"major work",method:lang==="zh"?"方法":"method",tool:lang==="zh"?"工具":"tool",concept:lang==="zh"?"概念":"concept"}[n.type||"concept"];
  const diff=n.difficulty||"intermediate";
  const CHAP_EN={foundational:"Chapter I · Foundations",intermediate:"Chapter II · Core Ideas",advanced:"Chapter III · Deep Cuts"};
  const CHAP_ZH={foundational:"第一章 · 基础",intermediate:"第二章 · 核心",advanced:"第三章 · 深入"};
  const chapLabel=(lang==="zh"?CHAP_ZH:CHAP_EN)[diff]||"";
  const tourPos=(META.tour||[]).indexOf(id);
  const posLabel=tourPos>=0?`${tourPos+1} / ${(META.tour||[]).length}`:"";
  const kicker=`${chapLabel}${posLabel?" — #"+posLabel:""} · ${typeLabel}`;
  let html = `<div class="kicker">${kicker}</div><div class="nm">${nm(n,lang)}</div><div class="alt">${altName}</div><div class="archive">`;
  if(what){ html+=`<div class="seg-label">${s.what}</div><div class="seg-body">${what}</div>`; }
  if(why){ html+=`<div class="seg-label">${s.why}</div><div class="seg-body">${why}</div>`; }
  if(quote){ html+=`<div class="quote" style="border-color:${TH.accent}66"><div class="q">${quote}</div>${qsrc?`<div class="qs">— ${qsrc}</div>`:""}</div>`; }
  if(position){ html+=`<div class="seg-label">${s.position}</div><div class="seg-body">${position}</div>`; }
  html+=`<div class="seg-label">${s.rels}</div><div class="rels">${conns}</div>`;
  const src=(n.sources||[]).filter(Boolean);
  if(src.length){ const lbl = (G.source_mode==="corpus") ? (lang==="zh"?"出自你的文档":"from your documents") : s.src; html+=`<div class="qs" style="margin-top:14px">${lbl}: ${src.join(" · ")}</div>`; }
  html+=`</div>`;
  const insp=document.getElementById("inspector"); insp.innerHTML=html;
  insp.querySelectorAll(".rel").forEach(r=>r.onclick=()=>select(r.dataset.go));
  insp.scrollTop=0;
}

function buildControls(){
  const c=document.getElementById("controls");c.innerHTML="";
  const seg=document.createElement("div");seg.className="seg";seg.style.borderColor=TH.accent+"66";
  const en=document.createElement("button"),zh=document.createElement("button");en.textContent="EN";zh.textContent="中";en.id="b-en";zh.id="b-zh";en.onclick=()=>setLang("en");zh.onclick=()=>setLang("zh");
  seg.appendChild(en);seg.appendChild(zh);c.appendChild(seg);
  const tour=document.createElement("button");tour.className="pill";tour.id="b-tour";tour.style.borderColor=TH.accent+"66";tour.style.color=TH.text_on_bg;tour.onclick=()=>doTour(1);c.appendChild(tour);
  const prev=document.createElement("button");prev.className="pill";prev.textContent="‹";prev.style.borderColor=TH.accent+"66";prev.style.color=TH.text_on_bg;prev.onclick=()=>doTour(-1);c.appendChild(prev);
  const search=document.createElement("input");search.type="text";search.id="search";search.style.borderColor=TH.accent+"66";search.style.color=TH.text_on_bg;search.oninput=(e)=>doSearch(e.target.value);c.appendChild(search);
  const pos=document.createElement("span");pos.className="pos";pos.id="pos";c.appendChild(pos);
}
function setLang(l){
  lang=l;const en=document.getElementById("b-en"),zh=document.getElementById("b-zh");
  en.style.background=l==="en"?TH.accent:"transparent";en.style.color=l==="en"?TH.ink:TH.text_on_bg;
  zh.style.background=l==="zh"?TH.accent:"transparent";zh.style.color=l==="zh"?TH.ink:TH.text_on_bg;
  document.getElementById("b-tour").textContent=tourIdx<0?STR[l].tour:STR[l].next;
  document.getElementById("search").placeholder=STR[l].search;document.getElementById("legend").textContent=STR[l].leg;document.getElementById("presentBtn").textContent=STR[l].present;
  Object.entries(nodeEls).forEach(([id,g])=>{const t=g.querySelector("text");if(t)t.textContent=nm(byId[id],lang);});
  document.getElementById("h-expert").textContent=(G.expert||{})[lang]||(G.expert||{}).en||"";
  document.getElementById("h-domain").textContent=(G.domain||{})[lang]||(G.domain||{}).en||"";
  if(cur)render(cur);else document.getElementById("inspector").innerHTML=`<div class="hint">${STR[l].hint}</div>`;
}
function select(id){cur=id;tourIdx=-1;document.getElementById("pos").textContent="";document.getElementById("b-tour").textContent=STR[lang].tour;render(id);}
function doTour(dir){const tour=META.tour||[];if(!tour.length)return;if(dir>0&&tourIdx<0)tourIdx=0;else tourIdx=Math.max(0,Math.min(tour.length-1,tourIdx+dir));cur=tour[tourIdx];document.getElementById("pos").textContent=`${tourIdx+1} / ${tour.length}`;document.getElementById("b-tour").textContent=STR[lang].next;render(cur);}
function doSearch(q){q=(q||"").trim().toLowerCase();Object.entries(nodeEls).forEach(([id,g])=>{const n=byId[id];const hay=((n.name||{}).en||"")+" "+((n.name||{}).zh||"")+" "+sm(n,lang)+" "+pf(n,"what",lang);g.style.opacity=(!q||hay.toLowerCase().includes(q))?"1":"0.18";});}

const pb=document.getElementById("presentBtn");pb.style.borderColor=TH.accent+"66";pb.style.color=TH.text_on_bg;pb.onclick=togglePresent;
function togglePresent(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();document.body.classList.add("present");}else{document.exitFullscreen&&document.exitFullscreen();document.body.classList.remove("present");}setTimeout(computeLayout,120);}
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.body.classList.remove("present");setTimeout(computeLayout,120);});
document.addEventListener("keydown",(e)=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")doTour(1);else if(e.key==="ArrowLeft")doTour(-1);else if(e.key==="f"||e.key==="F")togglePresent();else if(e.key==="Escape"&&document.body.classList.contains("present"))document.body.classList.remove("present");});
let rT;window.addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(computeLayout,150);});

document.getElementById("svg-desc").textContent="Concept graph of "+((G.expert||{}).en||"");
const rat=(lang==="zh"?TH.rationale_zh:TH.rationale_en)||TH.rationale_en||"";
document.getElementById("rationale").textContent=rat?("Theme · "+TH.name+" — "+rat):("Theme · "+TH.name);

buildControls();computeLayout();setLang(lang);
</script>
